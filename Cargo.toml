[workspace]
resolver = "3"
members = ["core", "server", "src-tauri"]

[workspace.package]
version = "1.11.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
lobby-core = { path = "core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.54.1", features = ["net", "io-util", "sync", "time", "macros", "rt-multi-thread"] }
tokio-tungstenite = "0.30.0"
futures-util = "0.3.34"
toml = "1.2.1"
dirs = "7.0.0"
reqwest = { version = "0.13.5", features = ["gzip", "multipart"] }
getrandom = "0.4.3"
base64 = "0.23.1"
