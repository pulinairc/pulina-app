[package]
name = "lobby"
version = "0.1.0"
description = "A small, modern IRC client"
license = "MIT"
edition = "2024"

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = [] }
tauri-plugin-opener = "2.7.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.54.1", features = ["net", "io-util", "sync", "time"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
reqwest = { version = "0.13.5", features = ["gzip"] }
regex = "1.13.1"
toml = "1.2.1"
dirs = "7.0.0"
