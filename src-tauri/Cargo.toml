[package]
name = "lobby"
description = "A small, modern IRC client"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "lobby_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
lobby-core.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["process"] }
toml.workspace = true
dirs.workspace = true
futures-util.workspace = true
tokio-tungstenite = { workspace = true, features = ["rustls-tls-native-roots"] }
tauri = { version = "2.12.5", features = ["image-png"] }
tauri-plugin-opener = "2.7.2"
tauri-plugin-notification = "2.8.0"
reqwest = { version = "0.13.5", features = ["gzip"] }
regex = "1.13.1"
russh = { version = "0.65.1", default-features = false, features = ["ring", "rsa", "flate2"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
block2 = "0.6.2"
objc2-app-kit = { version = "0.3.2", features = ["NSApplication", "NSImage", "NSResponder", "NSDockTile"] }
objc2-foundation = { version = "0.3.2", features = ["NSData", "NSString", "NSURL", "NSArray", "NSError"] }
objc2-user-notifications = { version = "0.3.2", features = ["block2", "UNUserNotificationCenter", "UNNotificationContent", "UNNotificationRequest", "UNNotificationTrigger", "UNNotificationSound", "UNNotificationAttachment"] }

[target.'cfg(target_os = "ios")'.dependencies]
objc2-user-notifications = { version = "0.3.2", features = ["block2", "UNUserNotificationCenter"] }
