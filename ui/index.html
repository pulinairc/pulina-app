<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lobby</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <header id="top" data-tauri-drag-region="deep">
    <button id="title" type="button" aria-haspopup="dialog" aria-controls="switcher">
      <span id="chan-icon" class="chan-icon" data-tip="Channel picture">#</span>
      <span class="title-text">
        <span id="chan-name">Lobby</span>
        <span id="chan-meta"></span>
      </span>
    </button>
    <button id="unread" type="button" hidden></button>
    <button id="bell" class="head-btn" type="button" aria-pressed="false" aria-label="Mute channel" data-tip="Mute"></button>
    <button id="gear" type="button" aria-label="Settings" data-tip="Settings" aria-controls="settings">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </header>
  <div id="status" role="status" hidden></div>
  <div id="logwrap">
    <main id="log"><div id="col"></div></main>
    <div id="unread-bar">
      <button id="jump-unread" class="jump" type="button" hidden>
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
        Unread
      </button>
      <button id="mark-read" class="jump" type="button" data-tip="Shift+Esc" hidden>
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
        <span id="mark-read-label">Mark read</span>
      </button>
    </div>
    <button id="jump-latest" class="jump" type="button" hidden>
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M19 12l-7 7-7-7"/></svg>
      Latest
    </button>
  </div>
  <form id="composer">
    <div id="slash" role="listbox" aria-label="Commands" hidden></div>
    <div id="replying" hidden>
      <span class="rq-label">Replying to</span>
      <span id="reply-nick"></span>
      <span id="reply-text"></span>
      <button id="reply-close" type="button" aria-label="Cancel reply" data-tip="Cancel reply">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <label for="input" class="sr">Message</label>
    <input id="input" autocomplete="off" spellcheck="true" placeholder="Message">
  </form>

  <dialog id="switcher" tabindex="-1" aria-label="Channels">
    <label for="filter" class="sr">Find a channel</label>
    <input id="filter" autocomplete="off" placeholder="Jump to a channel or person">
    <div id="list" role="listbox"></div>
  </dialog>

  <dialog id="settings" tabindex="-1" aria-labelledby="settings-title">
    <div class="sheet-head">
      <h2 id="settings-title">Settings</h2>
      <button id="settings-close" type="button" aria-label="Close">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <section>
      <h3>Connections</h3>
      <div id="connections"></div>
    </section>
    <section>
      <button id="open-people" class="wide-btn" type="button">People and photos</button>
    </section>
    <section>
      <h3>Config file</h3>
      <p id="config-path" class="mono"></p>
      <p class="hint">Networks and the server address are set in this file.</p>
    </section>
  </dialog>
  <dialog id="people" tabindex="-1" aria-labelledby="people-title">
    <div class="sheet-head">
      <button id="people-back" class="icon-btn" type="button" aria-label="Back to people" data-tip="Back" hidden>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <h2 id="people-title">People</h2>
      <button id="person-new" class="icon-btn" type="button" aria-label="Add a person" data-tip="Add a person">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      </button>
      <button id="people-close" class="icon-btn" type="button" aria-label="Close">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>

    <div id="people-list-view">
      <div id="people-list"></div>
    </div>

    <form id="person-edit" hidden>
      <div class="person-top">
        <button id="person-photo" class="photo-btn" type="button" aria-label="Choose a photo" data-tip="Choose a photo, or paste one"></button>
        <div class="person-name-wrap person-only">
          <label for="person-name" class="sr">Name</label>
          <input id="person-name" class="field" autocomplete="off" placeholder="Name">
          <div class="photo-links">
            <button id="person-photo-remove" class="link-btn" type="button">Remove photo</button>
          </div>
        </div>
        <input id="person-file" type="file" accept="image/*" hidden>
      </div>

      <span class="field-label" id="person-color-label">Colour</span>
      <div id="person-colors" class="swatches" role="radiogroup" aria-labelledby="person-color-label"></div>
      <input id="person-color" type="color" class="sr" tabindex="-1" aria-hidden="true">

      <label class="mute-row channel-only" for="channel-mute">
        <span>Mute this channel</span>
        <input id="channel-mute" type="checkbox" role="switch">
      </label>

      <label for="person-nick" class="field-label person-only">Nicks</label>
      <div class="tag-field person-only">
        <div id="person-nicks" class="chips"></div>
        <input id="person-nick" autocomplete="off" placeholder="Add a nick, Enter">
      </div>
      <p class="hint person-only">Kaisla covers Kaisla_ too. Kaisla* matches any ending, kaisla@*.example.net matches ident and host.</p>

      <div class="person-buttons">
        <button id="person-delete" class="link-btn danger" type="button">Delete person</button>
        <button id="person-save" class="primary-btn" type="submit">Save</button>
      </div>
    </form>
  </dialog>
</body>
</html>
