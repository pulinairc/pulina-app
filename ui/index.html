<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lobby</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <header id="top" data-tauri-drag-region="deep">
    <button id="title" type="button" aria-haspopup="dialog" aria-controls="switcher">
      <span id="chan-icon" class="chan-icon" aria-hidden="true">#</span>
      <span class="title-text">
        <span id="chan-name">Lobby</span>
        <span id="chan-meta"></span>
      </span>
      <svg class="chev" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
    </button>
    <button id="unread" type="button" hidden></button>
    <button id="gear" type="button" aria-label="Settings" data-tip="Settings" aria-controls="settings">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </header>
  <div id="status" role="status" hidden></div>
  <main id="log"><div id="col"></div></main>
  <form id="composer">
    <div id="replying" hidden>
      <span class="rq-label">Replying to</span>
      <span id="reply-nick"></span>
      <span id="reply-text"></span>
      <button id="reply-close" type="button" aria-label="Cancel reply" data-tip="Cancel reply">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <label for="input" class="sr">Message</label>
    <input id="input" autocomplete="off" spellcheck="true" placeholder="Message">
  </form>

  <dialog id="switcher" aria-label="Channels">
    <label for="filter" class="sr">Find a channel</label>
    <input id="filter" autocomplete="off" placeholder="Jump to a channel or person">
    <div id="list" role="listbox"></div>
  </dialog>

  <dialog id="settings" aria-labelledby="settings-title">
    <div class="sheet-head">
      <h2 id="settings-title">Settings</h2>
      <button id="settings-close" type="button" aria-label="Close">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <section>
      <h3>Connections</h3>
      <div id="connections"></div>
    </section>
    <section>
      <h3>Config file</h3>
      <p id="config-path" class="mono"></p>
      <p class="hint">Networks and the server address live here for now. People and photos get their own page next.</p>
    </section>
  </dialog>
</body>
</html>
