# In /etc/nginx/sites-enabled/pulina.fi. At the top, beside the other zones:
limit_req_zone $binary_remote_addr zone=pulina_backlog:10m rate=30r/m;

# In the chat.pulina.fi 443 server, above the Lounge location:
location = /backlog {
    limit_req zone=pulina_backlog burst=10 nodelay;
    proxy_pass http://127.0.0.1:8731;
    add_header Strict-Transport-Security max-age=15768000;
}
