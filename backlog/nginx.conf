# In /etc/nginx/sites-enabled/pulina.fi. At the top, beside the other zones:
limit_req_zone $binary_remote_addr zone=pulina_backlog:10m rate=30r/m;

# In the chat.pulina.fi 443 server, above the Lounge location:
location = /backlog {
    limit_req zone=pulina_backlog burst=10 nodelay;
    proxy_pass http://127.0.0.1:8731;
    add_header Strict-Transport-Security max-age=15768000;
}

# Profile pictures. At the top, beside the other zones:
limit_req_zone $binary_remote_addr zone=pulina_avatar:10m rate=10r/m;

# In the chat.pulina.fi 443 server, above the Lounge location:
location = /avatar {
    limit_req zone=pulina_avatar burst=3 nodelay;
    client_max_body_size 300k;
    proxy_pass http://127.0.0.1:8732;
    add_header Strict-Transport-Security max-age=15768000;
}
location /a/ {
    proxy_pass http://127.0.0.1:8732;
    add_header Strict-Transport-Security max-age=15768000;
}

# Pulina accounts. At the top, beside the other zones:
limit_req_zone $binary_remote_addr zone=pulina_accounts:10m rate=20r/m;
map $account_name $account_port {
    default 0;
    include /etc/nginx/pulina-accounts.map;
}

# In the chat.pulina.fi 443 server, above the Lounge location:
location /accounts/ {
    limit_req zone=pulina_accounts burst=10 nodelay;
    proxy_pass http://127.0.0.1:8733;
    add_header Strict-Transport-Security max-age=15768000;
}
location ~ ^/u/(?<account_name>[a-z][a-z0-9_-]{1,9})/ {
    if ($account_port = 0) { return 404; }
    proxy_pass http://127.0.0.1:$account_port;
    proxy_http_version 1.1;
    proxy_set_header Connection "upgrade";
    proxy_set_header Upgrade $http_upgrade;
    proxy_read_timeout 1d;
}
