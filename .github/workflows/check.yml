---
name: Check

"on":
  push:
    branches: [main]
  pull_request:

# A newer push cancels the run on a pull request, but every run on main finishes, each in a
# group of its own: a group also drops a queued run for a newer one, and a cancelled run on
# main reads as a failed build in the badge.
concurrency:
  group: check-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Formatting and lint
        run: npm run check

      - name: Tests
        run: npm test

  macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

      - name: Build the app
        run: npx tauri build --bundles app

  ios:
    name: iOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios, aarch64-apple-ios-sim
          components: clippy
      - uses: Swatinem/rust-cache@v2

      - name: Lint for iPhone
        run: cargo clippy -p lobby --target aarch64-apple-ios -- -D warnings

      # The app's own iPhone build needs signing; the core it runs on is tested on the simulator.
      - name: Core tests on the iPhone simulator
        run: |
          udid=$(xcrun simctl list devices available --json | jq -r '[.devices[][] | select(.name | startswith("iPhone"))][0].udid')
          xcrun simctl boot "$udid"
          CARGO_TARGET_AARCH64_APPLE_IOS_SIM_RUNNER="xcrun simctl spawn $udid" cargo test -p lobby-core --target aarch64-apple-ios-sim

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

      - name: Build the installer
        run: npx tauri build --bundles nsis

      - name: Start the app and see it stay up
        shell: pwsh
        run: |
          # A fork such as the Pulina app names its own program.
          $name = (Get-Content src-tauri\tauri.conf.json -Raw | ConvertFrom-Json).mainBinaryName
          if (-not $name) { $name = 'lobby' }
          $app = Start-Process -FilePath "target\release\$name.exe" -PassThru
          Start-Sleep -Seconds 20
          if ($app.HasExited) { throw "$name exited with code $($app.ExitCode)" }
          Stop-Process -Id $app.Id

  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-linux-android, aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Build a debug APK for the emulator
        run: |
          export NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          npx tauri android init --ci
          npx tauri icon src-tauri/icons/icon.png
          npx tauri android build --ci --debug --apk --target x86_64

      - name: Let the emulator use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The system image download from Google fails now and then (a broken zip), which failed
      # the whole check, so the image and the emulator are made once and kept in the cache.
      - name: Keep the emulator in the cache
        uses: actions/cache@v6
        id: avd
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
            /usr/local/lib/android/sdk/system-images/android-34
          key: avd-34-google_apis-x86_64

      - name: Make the emulator
        if: steps.avd.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Emulator made"

      - name: Start the app on an emulator and see it stay up
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: sh tools/android-smoke.sh

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-smoke
          path: android-smoke.png
          if-no-files-found: ignore
