---
name: Release

"on":
  push:
    branches: [main]
    paths:
      - 'CHANGELOG.md'

jobs:
  release:
    # Forks such as the Pulina app release on their own terms.
    if: github.repository == 'rollecode/lobby'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      created: ${{ steps.check.outputs.exists == 'false' }}
      tag: v${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Get version from CHANGELOG
        id: version
        run: |
          VERSION=$(grep -m1 '^### ' CHANGELOG.md | sed 's/### \([0-9.]*\).*/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Found version: $VERSION"

      - name: Check if release exists
        if: steps.version.outputs.version != ''
        id: check
        run: |
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}

      # Written to a file rather than an output, so a backtick or quote in the
      # changelog is never run as a shell command.
      - name: Extract release notes
        if: steps.check.outputs.exists == 'false'
        run: awk '/^### [0-9]/{if(p) exit; p=1; next} p' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"

      - name: Create release
        if: steps.check.outputs.exists == 'false'
        run: |
          gh release create "v$VERSION" \
            --title "$VERSION" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}

  build:
    needs: release
    if: needs.release.outputs.created == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            bundles: deb,appimage
          - os: macos-latest
            bundles: dmg
          - os: windows-latest
            bundles: nsis
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Install system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build the app
        run: npx --yes @tauri-apps/cli@2 build --bundles ${{ matrix.bundles }}

      - name: Attach to the release
        shell: bash
        run: find target/release/bundle \( -name '*.deb' -o -name '*.AppImage' -o -name '*.dmg' -o -name '*-setup.exe' \) -exec gh release upload "$TAG" {} --clobber \;
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag }}

  android:
    needs: release
    if: needs.release.outputs.created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, i686-linux-android, x86_64-linux-android
      - uses: Swatinem/rust-cache@v2

      - name: Build the APK
        run: |
          export NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          npx --yes @tauri-apps/cli@2 android init --ci
          npx --yes @tauri-apps/cli@2 icon src-tauri/icons/icon.png
          npx --yes @tauri-apps/cli@2 android build --ci --apk

      # The keystore lives only in the repository secrets and with the maintainer: every update must carry the same signature.
      - name: Sign and attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag }}
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::warning::No ANDROID_KEYSTORE secret, so no APK is attached"
            exit 0
          fi
          tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)
          unsigned=$(find src-tauri/gen/android/app/build/outputs/apk -name '*release-unsigned.apk' | head -n1)
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/lobby.jks"
          "$tools/zipalign" -f 4 "$unsigned" "$RUNNER_TEMP/aligned.apk"
          apk="Lobby_${TAG#v}_android.apk"
          "$tools/apksigner" sign --ks "$RUNNER_TEMP/lobby.jks" --ks-pass env:KEYSTORE_PASSWORD --out "$apk" "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" verify "$apk"
          gh release upload "$TAG" "$apk" --clobber
